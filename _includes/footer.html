{%- assign a = site.author -%}
<footer class="site-footer">
  <div class="site-footer__inner">
    <ul class="site-footer__links" aria-label="Contact and profiles">
      <li><a href="mailto:{{ a.email }}">{{ a.email }}</a></li>
      {%- for l in a.links %}
      <li><a href="{{ l.url }}">{{ l.name }}</a></li>
      {%- endfor %}
    </ul>
    <p class="site-footer__copy">&copy; {{ site.time | date: "%Y" }} {{ a.name }} · Last updated {{ site.time | date: "%B %Y" }}</p>
  </div>
</footer>
