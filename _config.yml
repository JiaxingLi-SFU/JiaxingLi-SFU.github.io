# Site settings
# Restart `jekyll serve` after editing this file; it is not reloaded automatically.

title: "Jiaxing Li"
description: "Ph.D. student in Computing Science at Simon Fraser University, working on LLM applications, cloud/edge computing, and distributed systems."
url: "https://jiaxingli-sfu.github.io"
baseurl: ""
repository: "JiaxingLi-SFU/JiaxingLi-SFU.github.io"
locale: "en-US"
timezone: America/Vancouver
# GitHub Pages applies the Primer theme by default; this site has its own layouts and styles.
theme: null

# Profile shown at the top of the homepage
author:
  name: "Jiaxing Li"
  avatar: "/images/jiaxingli-avatar.jpg"
  position: "Ph.D. Student in Computing Science"
  # One line under your name in the hero. Wrap a phrase in *asterisks* to highlight it.
  tagline: "Building *LLM systems* that work across the cloud, the edge, and everything in between."
  advisor:
    name: "Prof. Jiangchuan Liu"
    url: "https://www.cs.sfu.ca/~jcliu/"
  affiliation: "Simon Fraser University"
  affiliation_url: "https://www.sfu.ca/computing.html"
  location: "Vancouver, Canada"
  email: "jla641@sfu.ca"
  # Profile links, shown in this order. Remove a line to hide that link.
  links:
    - name: "Google Scholar"
      icon: "googlescholar"
      url: "https://scholar.google.com/citations?user=z1lpmSoAAAAJ&hl=en"
    - name: "DBLP"
      icon: "dblp"
      url: "https://dblp.org/pid/29/3987-6"
    - name: "ORCID"
      icon: "orcid"
      url: "https://orcid.org/0009-0006-4845-3270"
    - name: "LinkedIn"
      icon: "linkedin"
      url: "https://www.linkedin.com/in/jiaxing-li-5b5b7924a"

# Publications: one Markdown file per paper in _publications/
collections:
  publications:
    output: true
    permalink: /publication/:path/

defaults:
  - scope:
      path: ""
      type: publications
    values:
      layout: publication

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo
highlighter: none
future: true

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

exclude:
  - README.md
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - .jekyll-cache
  - .sass-cache
  - node_modules
